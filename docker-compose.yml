services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_db_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_db_name"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./Kanban_doska
    image: kanban_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./Kanban_doska/.env
    environment:
      - DB_ADDR=db
      - SERVER_ADDR=0.0.0.0
      - JWT_SECRET=test_secret_for_dev_change_me
    volumes:
      - ./Kanban_doska:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Kanban_frontend
    image: kanban_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  adminer:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8080"

volumes:
  postgres_data:
